name: Update Zn Pb Prices

on:
  schedule:
    - cron: '50,55 0 * * 1-5'
    - cron: '*/5 1-6 * * 1-5'
    - cron: '0,5 7 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install akshare

      - name: Fetch prices
        run: python3 scripts/fetch-prices.py

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/price.json
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "Price update: Zn=$(python3 -c "import json;print(int(json.load(open('data/price.json'))['zn']['price']))") Pb=$(python3 -c "import json;print(int(json.load(open('data/price.json'))['pb']['price']))")"
            git push
          fi

      - name: 失败告警（自动开 Issue）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ 行情更新失败 ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `工作流 **${context.workflow}** 运行失败。`,
              ``,
              `- 运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- 触发时间：${new Date().toISOString()}`,
              ``,
              `**排查提示**：优先检查 akshare 接口是否改名（历史案例：futures_zh_realtime → futures_zh_realtime_sina，2026-11-13 起静默失败 6 天）。`
            ].join(String.fromCharCode(10));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
